<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Brick Game — Tetris</title>
    <meta name="description" content="A playable 3D Brick Game handheld: classic Tetris with honest rules, right in the browser." />
    <meta name="theme-color" content="#0e0b08" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/src/assets/brick-game.glb" as="fetch" crossorigin />
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        height: 100%;
        background: #0e0b08;
        color-scheme: dark;
      }
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: radial-gradient(ellipse 120% 85% at 50% 42%, #3a2b1d 0%, #221a12 45%, #0e0b08 100%);
        color: #a8997f;
        font: 13px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #root {
        position: fixed;
        inset: 0;
      }
      #loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        padding: 24px;
        transition: opacity 0.4s, visibility 0s 0.4s;
      }
      #loader.done {
        opacity: 0;
        visibility: hidden;
      }
      #loader span {
        display: flex;
        gap: 6px;
      }
      #loader i {
        width: 18px;
        height: 18px;
        padding: 3px;
        border: 2px solid #b8b898;
        border-radius: 2px;
        animation: blink 1.2s infinite both;
      }
      #loader i::after {
        content: "";
        display: block;
        height: 100%;
        border-radius: 1px;
        background: #b8b898;
      }
      #loader i:nth-child(2) {
        animation-delay: 0.2s;
      }
      #loader i:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 0.15;
        }
        30% {
          opacity: 1;
        }
      }
      #loader p {
        max-width: 320px;
        margin: 0;
        text-align: center;
        letter-spacing: 0.04em;
      }
      #loader.failed i {
        display: none;
      }
      #loader.failed p {
        color: #e3d5bd;
      }
      #help {
        position: fixed;
        left: 24px;
        bottom: 20px;
        display: none;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 12px;
        opacity: 0.8;
        pointer-events: none;
      }
      #help kbd {
        font: inherit;
        color: #e3d5bd;
      }
      /* only with a keyboard and mouse, and only where it fits beside the console */
      @media (hover: hover) and (pointer: fine) and (min-width: 900px) and (min-aspect-ratio: 5/4) {
        #help {
          display: block;
        }
      }
      #loader.failed ~ #help {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #loader i {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="loader" role="status">
      <span aria-hidden="true"><i></i><i></i><i></i></span>
      <p>Loading…</p>
    </div>
    <ul id="help" aria-label="Keyboard controls">
      <li><kbd>←</kbd> <kbd>→</kbd> move · <kbd>↓</kbd> soft drop · <kbd>Space</kbd> drop</li>
      <li><kbd>↑</kbd> <kbd>X</kbd> rotate · <kbd>Z</kbd> rotate back</li>
      <li><kbd>Enter</kbd> start / pause · <kbd>R</kbd> reset</li>
      <li><kbd>M</kbd> sound · <kbd>G</kbd> ghost piece</li>
      <li>On the title: <kbd>←</kbd> <kbd>→</kbd> level</li>
    </ul>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
